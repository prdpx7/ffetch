[package]
name = "ffetch"
version = "0.3.0"
edition = "2024"
description = "A programmable web research CLI: fetch, discover, recover, and query"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
html2text = "0.16"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }
jmespath = { version = "0.4", features = ["sync"] }
quick-xml = { version = "0.42", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate", "stream"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tempfile = "3"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
