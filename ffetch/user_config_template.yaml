# ffetch configuration
# docs: https://github.com/prdpx7/ffetch

defaults:
  tier_order: [fast, render, stealth]
  timeout: 30
  impersonate: chrome
  html_size_threshold: 5000
  lightpanda_bin: lightpanda
  playwright_wait: networkidle
  playwright_sleep: 1.0
  stealth_sleep: 2.0

  # Bot detection signals are loaded from ffetch/signals/blocked.txt and js_required.txt
  # To override, uncomment and edit:
  # blocked_signals:
  #   - "prove your humanity"
  #   - "captcha"
  # js_required_signals:
  #   - '<div id="root"></div>'

  extraction:
    include_links: true
    include_images: false
    include_tables: true
    favor_recall: true
    fallback_extractor: readability

cache:
  enabled: false
  dir: "~/.cache/ffetch"
  ttl_seconds: 3600

# Per-site rules: force a tier or extraction settings for specific domains
# *.reddit.com also matches bare reddit.com
sites:
  - pattern: "*.reddit.com"
    tier: render
  - pattern: "*.twitter.com"
    tier: stealth
  - pattern: "*.x.com"
    tier: stealth
