[project]
name = "ffetch"
version = "0.2.0"
description = "Smart web fetcher with auto-escalating tiers: fast → render → stealth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "curl-cffi>=0.7,<1.0",
    "trafilatura>=2.0",
    "playwright>=1.49",
    "mcp>=1.0",
    "pyyaml>=6.0",
    "readability-lxml>=0.8",
]

[project.optional-dependencies]
stealth = [
    "botasaurus>=4.0",
]

[project.scripts]
ffetch = "ffetch.cli:main"
ffetch-mcp = "ffetch.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffetch"]

[dependency-groups]
dev = []
